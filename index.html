<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>WODBOHX | Performance Club</title>
<style>
:root{color-scheme:dark;--bg:#090909;--surface:#121212;--surface2:#181818;--line:#30291c;--gold:#d5b56d;--gold2:#f0d99c;--white:#f5f3ed;--muted:#a19c90;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -18%,#43351b66,transparent 50%),var(--bg);color:var(--white)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}.top{position:sticky;top:0;z-index:3;background:#090909ed;border-bottom:1px solid #ffffff16;backdrop-filter:blur(15px)}.topin,.brand,.nav,.actions{display:flex;align-items:center;gap:9px}.topin{min-height:74px;justify-content:space-between}.brand{font-weight:900;letter-spacing:.13em}.brand b{color:var(--gold2)}.brand small{display:block;color:var(--muted);font-size:.58rem;letter-spacing:.2em}.mark{width:38px;height:38px;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font:1.3rem Georgia;border-radius:12px}.nav button,.btn{border:1px solid var(--line);border-radius:12px;padding:10px 13px;background:#141414;color:var(--white);font-size:.78rem;font-weight:750;transition:.18s}.nav button.active,.btn.gold{background:var(--gold);border-color:var(--gold);color:#17130a}.btn:hover,.nav button:hover{border-color:var(--gold);transform:translateY(-1px)}.btn:disabled{opacity:.45;cursor:not-allowed}main{padding:38px 0 70px}.hero{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:26px}.hero h1{font:clamp(2.2rem,6vw,4.5rem)/1 Georgia,serif;margin:12px 0}.hero em,.kicker{color:var(--gold);font-style:normal}.kicker{font-size:.7rem;letter-spacing:.2em;font-weight:800}.muted{color:var(--muted);font-size:.8rem}.stats,.grid,.students{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stats{grid-template-columns:repeat(4,1fr);margin:22px 0}.stat,.card,.panel,.student,.loginbox,.modal{background:linear-gradient(145deg,#161616,#101010);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 32px #0002}.stat,.card,.panel,.student{padding:17px}.stat label{font-size:.67rem;color:var(--muted);letter-spacing:.12em}.stat strong{display:block;color:var(--gold2);font:1.8rem Georgia;margin-top:8px}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 13px}.bar h2,.panel h2{font:1.4rem Georgia;margin:0}.input,.select,.area{background:#0d0d0d;border:1px solid #393329;color:var(--white);padding:11px 12px;border-radius:12px;outline:none}.input:focus,.select:focus,.area:focus{border-color:var(--gold)}.cardtop,.cardfoot,.timerline{display:flex;align-items:center;justify-content:space-between;gap:10px}.tag{color:var(--gold);border:1px solid #b89a5b66;padding:5px 9px;font-size:.67rem;text-transform:uppercase;border-radius:99px}.card h3{font:1.35rem Georgia;margin:14px 0 6px}.detail{white-space:pre-wrap;line-height:1.55;background:#0c0c0c;border:1px solid #ffffff12;border-left:3px solid var(--gold);padding:13px;margin:14px 0;color:#ddd8cd;border-radius:12px}.panel{margin-top:20px}.timer{max-width:820px;margin:15px auto;padding:clamp(18px,4vw,36px);text-align:center;border:1px solid #645331;background:#0d0d0d;border-radius:26px;box-shadow:0 18px 48px #0005}.timerline{text-align:left}.clock{font:clamp(4rem,13vw,8rem)/1 ui-monospace,monospace;letter-spacing:-.08em;color:var(--gold2);margin:22px 0 5px;font-variant-numeric:tabular-nums}.subclock{font:1rem ui-monospace,monospace;margin:7px}.status{font-size:.7rem;color:var(--gold);letter-spacing:.18em;text-transform:uppercase}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:20px}.controls .btn{min-width:125px;padding:13px}.laps{display:flex;justify-content:center;flex-wrap:wrap;gap:7px}.lap{font-size:.75rem;color:var(--muted);border:1px solid #ffffff16;padding:7px 10px;border-radius:99px}.duration-config,.tabata-config{display:flex;justify-content:center;align-items:end;gap:12px;flex-wrap:wrap;margin:18px}.field{display:grid;gap:6px;margin:10px 0;text-align:left}.field label{font-size:.73rem;color:var(--muted)}.field input{width:90px;text-align:center}.calendar{background:#111;border:1px solid var(--line);border-radius:20px;overflow:hidden}.calhead{padding:12px;display:flex;justify-content:space-between;align-items:center}.calmonth{font:1.3rem Georgia;color:var(--gold2)}.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekday,.day{border-top:1px solid #ffffff12;border-right:1px solid #ffffff12;padding:6px}.weekday{text-align:center;color:var(--gold);font-size:.65rem}.day{min-height:95px;cursor:pointer}.day:hover,.day.selected{box-shadow:inset 0 0 0 1px var(--gold);background:#d5b56d0b}.day.other{opacity:.4}.daynum{font-size:.72rem;margin-bottom:5px}.daywod{display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:3px 0;padding:5px 7px;text-align:left;background:#d5b56d12;border:1px solid #b89a5b55;color:var(--gold2);font-size:.6rem;border-radius:8px}.daywod.studentwod{color:#eee;border-color:#ffffff30;background:#ffffff0b}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.loginbox{width:min(420px,100%);padding:28px}.notice{font-size:.75rem;line-height:1.5;color:#d4c8ad;border-left:2px solid var(--gold);padding:10px;margin-top:14px}.loginbox .btn{width:100%}.modalback{position:fixed;inset:0;z-index:8;background:#000c;display:grid;place-items:center;padding:14px}.modal{width:min(560px,100%);padding:20px;max-height:90vh;overflow:auto;border-color:var(--gold);border-radius:24px}.modalhead{display:flex;justify-content:space-between;align-items:center}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}.toast{position:fixed;z-index:10;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gold);color:#17130a;padding:11px 15px;font-weight:bold;border-radius:12px;box-shadow:0 8px 26px #0007}.foot{text-align:center;color:#756f62;font-size:.7rem;margin-top:28px}.tablewrap{overflow:auto}table{width:100%;border-collapse:separate;border-spacing:0;border-radius:12px;overflow:hidden}td,th{text-align:left;padding:10px;border-bottom:1px solid #ffffff16;font-size:.8rem}th{color:var(--gold);text-transform:uppercase;font-size:.67rem}.empty{grid-column:1/-1;text-align:center;padding:36px;color:var(--muted);border:1px dashed var(--line);border-radius:18px}.student{border-radius:16px}@media(max-width:720px){.topin{padding:10px 0;flex-wrap:wrap}.nav{order:3;width:100%;overflow:auto}.nav button{flex:1;padding:8px 4px}.hero{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.grid,.students{grid-template-columns:1fr}.bar{align-items:flex-start;flex-direction:column}.day{min-height:72px;padding:3px}.daywod{font-size:.52rem}.weekday{font-size:.55rem;padding:6px 1px}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.timerline{align-items:flex-start;flex-direction:column}}
</style></head>
<body><div id="root"></div><div id="toast" class="toast hidden"></div>
<script>
(()=>{
const KEY='wodbohx.v1',today=()=>new Date().toISOString().slice(0,10),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),seed=()=>({users:[{name:'Coach WODBOHX',username:'coach',password:'coach123',role:'coach'},{name:'Alumno Demo',username:'alumno',password:'alumno123',role:'athlete',studentId:'demo'}],students:[{id:'demo',name:'Alumno Demo',username:'alumno',level:'Intermedio'}],wods:[],results:[]});
let db,me=null,view='wods',calendarDate=new Date(),selectedDate=today(),timer={state:'idle',mode:'For Time',elapsed:0,start:0,countdownEnd:0,lastBeep:null,lastCue:-1,laps:[],wodId:'',duration:20,work:20,rest:10,rounds:8,interval:null};const root=document.querySelector('#root');
function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),2300)}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function isCoach(){return me?.role==='coach'}function visibleWods(){return me?.role==='athlete'?db.wods.filter(w=>!w.studentId||w.studentId===me.studentId):db.wods}
function login(){root.innerHTML=`<main class="login"><section class="loginbox"><div class="brand"><div class="mark">W</div><div>WOD<b>BOHX</b><small>PERFORMANCE CLUB</small></div></div><h1 style="font:2.4rem Georgia">Train with purpose.</h1><form id="loginForm"><div class="field"><label>Usuario</label><input class="input" name="u" required></div><div class="field"><label>Contraseña</label><input class="input" name="p" type="password" required></div><button class="btn gold">Ingresar</button></form><div class="notice">Demo local: coach / coach123 · alumno / alumno123. Almacenamiento local, no usar credenciales reales.</div></section></main>`;document.querySelector('#loginForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);me=db.users.find(u=>u.username.toLowerCase()===f.get('u').trim().toLowerCase()&&u.password===f.get('p'));if(!me){toast('Usuario o contraseña incorrectos');return}render()}}
function render(){if(!me)return login();const ws=visibleWods();root.innerHTML=`<header class="top"><div class="wrap topin"><div class="brand"><div class="mark">W</div><div>WOD<b>BOHX</b><small>PERFORMANCE CLUB</small></div></div><nav class="nav">${[['wods','WODs'],['calendar','Calendario'],['timer','Cronómetro'],...(isCoach()?[['students','Alumnos']]:[])].map(([v,n])=>`<button data-view="${v}" class="${view===v?'active':''}">${n}</button>`).join('')}</nav><div class="actions"><span class="muted">${esc(me.name)}</span><button class="btn" id="logout">Salir</button></div></div></header><main class="wrap"><section class="hero"><div><div class="kicker">HYROX · CROSSFIT · ATHX</div><h1>Train. Track. <em>Repeat.</em></h1><p class="muted">Entrenamientos, tiempos y progreso.</p></div>${isCoach()&&['wods','calendar'].includes(view)?'<button id="newWod" class="btn gold">＋ Programar WOD</button>':''}</section>${view==='wods'?wodsView(ws):view==='calendar'?calendarView(ws):view==='timer'?timerView(ws):studentsView()}<div class="foot">WODBOHX · Entrena con intención</div></main>`;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelector('#logout').onclick=()=>{me=null;clearInterval(timer.interval);login()};if(view==='wods')bindWods(ws);if(view==='calendar')bindCalendar();if(view==='timer')bindTimer(ws);if(view==='students')bindStudents()}
function wodCards(list){return list.length?list.map(w=>`<article class="card"><div class="cardtop"><span class="tag">${esc(w.type)}</span><span class="muted">${esc(w.date)}</span></div><h3>${esc(w.title)}</h3><span class="muted">${esc(w.modality)} · ${Number(w.duration)||20} min${w.studentId?' · individual':''}</span><div class="detail">${esc(w.details)}</div><div class="cardfoot"><span class="muted">${w.studentId?'WOD PERSONAL':'WOD DE CLASE'}</span><div class="actions"><button class="btn" data-timer="${esc(w.id)}">⏱ Iniciar</button>${isCoach()?`<button class="btn" data-edit="${esc(w.id)}">Editar</button><button class="btn" data-del="${esc(w.id)}">×</button>`:''}</div></div></article>`).join(''):'<div class="empty">No hay WODs para este día.</div>'}
function wodsView(ws){return `<section class="stats"><div class="stat"><label>WODs</label><strong>${ws.length}</strong></div><div class="stat"><label>Hyrox</label><strong>${db.wods.filter(w=>w.type==='Hyrox').length}</strong></div><div class="stat"><label>CrossFit</label><strong>${db.wods.filter(w=>w.type==='CrossFit').length}</strong></div><div class="stat"><label>ATHX</label><strong>${db.wods.filter(w=>w.type==='ATHX').length}</strong></div></section><div class="bar"><h2>${isCoach()?'WOD programados':'Mis WODs'}</h2><input id="search" class="input" placeholder="Buscar WOD"></div><section id="wodCards" class="grid">${wodCards(ws)}</section><section class="panel"><h2>Resultados recientes</h2>${resultsTable()}</section>`}
function resultsTable(){const rs=db.results.filter(r=>isCoach()||r.studentId===me.studentId).slice().reverse().slice(0,10);return rs.length?`<div class="tablewrap"><table><thead><tr><th>WOD</th>${isCoach()?'<th>Alumno</th>':''}<th>Tiempo</th><th>Vueltas</th><th>Fecha</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${esc(db.wods.find(w=>w.id===r.wodId)?.title||'WOD')}</td>${isCoach()?`<td>${esc(db.students.find(s=>s.id===r.studentId)?.name||'')}</td>`:''}<td>${fmt(r.time)}</td><td>${r.laps?.length||0}</td><td>${new Date(r.date).toLocaleDateString('es-CL')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Aún no hay resultados guardados.</p>'}
function studentsView(){return `<div class="bar"><h2>Alumnos (${db.students.length})</h2><button id="addStudent" class="btn gold">＋ Agregar alumno</button></div><section class="students">${db.students.map(s=>`<article class="student"><b>${esc(s.name)}</b><span class="muted">@${esc(s.username)} · ${esc(s.level||'')}</span></article>`).join('')||'<div class="empty">Aún no hay alumnos.</div>'}</section><section class="panel"><h2>Resultados</h2>${resultsTable()}</section>`}
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function calendarView(ws){const year=calendarDate.getFullYear(),month=calendarDate.getMonth(),first=new Date(year,month,1),start=new Date(year,month,1-((first.getDay()+6)%7)),label=calendarDate.toLocaleDateString('es-CL',{month:'long',year:'numeric'});let cells='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let key=dateKey(d),day=ws.filter(w=>w.date===key);cells+=`<div class="day ${d.getMonth()!==month?'other':''} ${key===selectedDate?'selected':''}" data-day="${key}"><div class="daynum">${d.getDate()}</div>${day.slice(0,3).map(w=>`<button class="daywod ${w.studentId?'studentwod':''}" data-calwod="${esc(w.id)}">${esc(w.title)}</button>`).join('')}${day.length>3?`<span class="muted">+${day.length-3}</span>`:''}</div>`}const day=ws.filter(w=>w.date===selectedDate);return `<div class="bar"><h2>Calendario de WODs</h2><span class="muted">Selecciona un día. Puedes agregar y editar varios WODs por fecha.</span></div><section class="calendar"><div class="calhead"><button id="prev" class="btn">←</button><strong class="calmonth">${esc(label)}</strong><div class="actions"><button id="today" class="btn">Hoy</button><button id="next" class="btn">→</button></div></div><div class="calgrid">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div></section><section class="panel"><div class="bar"><h2>WODs · ${new Date(selectedDate+'T12:00:00').toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'})}</h2>${isCoach()?'<button id="addDay" class="btn gold">＋ Agregar WOD</button>':''}</div><section class="grid">${wodCards(day)}</section></section>`}
function bindCalendar(){document.querySelector('#prev').onclick=()=>{calendarDate.setMonth(calendarDate.getMonth()-1);render()};document.querySelector('#next').onclick=()=>{calendarDate.setMonth(calendarDate.getMonth()+1);render()};document.querySelector('#today').onclick=()=>{calendarDate=new Date();selectedDate=today();render()};document.querySelectorAll('[data-day]').forEach(d=>d.onclick=e=>{if(!e.target.closest('[data-calwod]')){selectedDate=d.dataset.day;render()}});document.querySelectorAll('[data-calwod]').forEach(b=>b.onclick=e=>{e.stopPropagation();const w=db.wods.find(x=>x.id===b.dataset.calwod);if(w&&isCoach())wodModal(w);else if(w){selectedDate=w.date;render()}});document.querySelector('#addDay')?.addEventListener('click',()=>wodModal(null,selectedDate));document.querySelector('#newWod')?.addEventListener('click',()=>wodModal(null,selectedDate));bindCardActions()}
function fmt(s){s=Math.max(0,Math.floor(s));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}function elapsedNow(){return timer.state==='running'?timer.elapsed+(performance.now()-timer.start)/1000:timer.elapsed}function totalTime(){return timer.mode==='Tabata'?(timer.work+timer.rest)*timer.rounds:timer.duration*60}function restTime(){return Math.max(0,totalTime()-elapsedNow())}function tabataInfo(){const cycle=timer.work+timer.rest,elapsed=elapsedNow(),round=Math.min(timer.rounds,Math.floor(elapsed/cycle)+1),at=elapsed-(round-1)*cycle;return at<timer.work?{round,phase:'Trabajo',left:timer.work-at}:{round,phase:'Descanso',left:cycle-at}}
function timerView(ws){const w=db.wods.find(x=>x.id===timer.wodId),isTabata=timer.mode==='Tabata',phase=tabataInfo();return `<section class="timer"><div class="timerline"><div><div class="kicker">CRONÓMETRO WOD</div><div class="muted">${esc(w?.title||'Cronómetro libre')}</div></div><div class="actions"><select id="wodSelect" class="select"><option value="">Cronómetro libre</option>${ws.map(x=>`<option value="${esc(x.id)}" ${timer.wodId===x.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select><select id="mode" class="select">${['For Time','AMRAP','EMOM','Tabata'].map(m=>`<option ${timer.mode===m?'selected':''}>${m}</option>`).join('')}</select></div></div><div id="standardConfig" class="duration-config" style="${isTabata?'display:none':''}"><label class="muted" for="duration">Duración total</label><input id="duration" class="input" type="number" min="1" max="240" value="${timer.duration}" ${['running','countdown'].includes(timer.state)?'disabled':''}><span class="muted">minutos</span></div><div id="tabataConfig" class="tabata-config" style="${isTabata?'':'display:none'}"><div class="field"><label>Trabajo (seg)</label><input id="work" class="input" type="number" min="5" max="300" value="${timer.work}" ${['running','countdown'].includes(timer.state)?'disabled':''}></div><div class="field"><label>Descanso (seg)</label><input id="rest" class="input" type="number" min="0" max="180" value="${timer.rest}" ${['running','countdown'].includes(timer.state)?'disabled':''}></div><div class="field"><label>Rondas</label><input id="rounds" class="input" type="number" min="1" max="50" value="${timer.rounds}" ${['running','countdown'].includes(timer.state)?'disabled':''}></div></div><p class="muted">EMOM: avisos de voz y sonido agudo a los 30 y 50 segundos de cada minuto.</p><div id="status" class="status">${timer.state==='running'?'En curso':timer.state==='countdown'?'Prepárate':timer.state==='paused'?'Pausado':timer.state==='done'?'Finalizado':'Listo para iniciar'}</div><div id="clock" class="clock">${fmt(elapsedNow())}</div><div id="subclock" class="subclock">${subclockText()}</div><p class="muted">Cuenta grande: tiempo transcurrido · cuenta pequeña: tiempo restante / fase.</p><div class="controls"><button id="start" class="btn gold">${timer.state==='running'?'Pausar':timer.state==='paused'?'Reanudar':'Iniciar WOD'}</button><button id="lap" class="btn" ${timer.state!=='running'?'disabled':''}>＋ Vuelta</button><button id="finish" class="btn" ${!['running','paused'].includes(timer.state)?'disabled':''}>Finalizar</button><button id="reset" class="btn">Reiniciar</button></div><div class="laps">${timer.laps.map((x,i)=>`<span class="lap">Vuelta ${i+1} · ${fmt(x)}</span>`).join('')}</div></section><section class="panel"><h2>Resultados recientes</h2>${resultsTable()}</section>`}
function subclockText(){if(timer.mode==='Tabata'){const p=tabataInfo();return `Ronda ${p.round}/${timer.rounds} · ${p.phase}: ${fmt(p.left)}`}if(timer.mode==='EMOM'){const elapsed=elapsedNow(),minute=Math.floor(elapsed/60)+1,sec=Math.floor(elapsed%60),next=sec<30?30:sec<50?50:60;return `Restante ${fmt(restTime())} · Min ${minute} · Próximo aviso en ${next-sec}s`}return `Restante: ${fmt(restTime())}`}
let audio=null;function beep(freq=720,duration=130){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.17,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration/1000);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration/1000)}catch(e){console.warn('Audio no disponible',e)}}
function speakEmomCue(message){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(message);utterance.lang='en-US';utterance.rate=1;utterance.pitch=1.5;utterance.volume=1;window.speechSynthesis.speak(utterance)}
function bindTimer(ws){const mode=document.querySelector('#mode');mode.onchange=()=>{timer.mode=mode.value;render()};document.querySelector('#wodSelect').onchange=e=>{timer.wodId=e.target.value;const w=db.wods.find(x=>x.id===timer.wodId);if(w){timer.duration=Number(w.duration)||timer.duration;render()}};const dur=document.querySelector('#duration');if(dur)dur.onchange=()=>{timer.duration=Math.max(1,Math.min(240,Number(dur.value)||20));dur.value=timer.duration;const w=db.wods.find(x=>x.id===timer.wodId);if(w){w.duration=timer.duration;save()}refreshTimer()};['work','rest','rounds'].forEach(id=>{const el=document.querySelector('#'+id);if(el)el.onchange=()=>{timer[id]=Math.max(Number(el.min),Math.min(Number(el.max),Number(el.value)||Number(el.min)));el.value=timer[id];refreshTimer()}});document.querySelector('#start').onclick=()=>{if(timer.state==='running'){timer.elapsed=elapsedNow();timer.state='paused';clearInterval(timer.interval)}else if(timer.state==='paused'){timer.state='running';timer.start=performance.now()}else{timer.elapsed=0;timer.lastCue=-1;timer.laps=[];timer.countdownEnd=Date.now()+3000;timer.lastBeep=null;timer.state='countdown';clearInterval(timer.interval);timer.interval=setInterval(tick,40)}render()};document.querySelector('#lap').onclick=()=>{if(timer.state!=='running')return;timer.laps.push(Math.floor(elapsedNow()));render()};document.querySelector('#finish').onclick=finish;document.querySelector('#reset').onclick=()=>{clearInterval(timer.interval);timer.state='idle';timer.elapsed=0;timer.laps=[];timer.lastCue=-1;render()}}
function refreshTimer(){const c=document.querySelector('#clock');if(c)c.textContent=fmt(elapsedNow());const s=document.querySelector('#subclock');if(s)s.textContent=subclockText();const d=document.querySelector('#duration');if(d)d.disabled=['running','countdown'].includes(timer.state)}
function tick(){if(timer.state==='countdown'){const n=Math.max(0,Math.ceil((timer.countdownEnd-Date.now())/1000));if(n>0&&n<=3&&timer.lastBeep!==n){timer.lastBeep=n;beep(520,115)}if(n===0){timer.state='running';timer.start=performance.now();timer.lastBeep=0;beep(980,360);toast('¡WOD en marcha!')}}if(timer.state==='running'){const elapsed=elapsedNow(),sec=Math.floor(elapsed),minuteSec=sec%60;if(timer.mode==='EMOM'&&(minuteSec===30||minuteSec===50)&&timer.lastCue!==sec){timer.lastCue=sec;const cue=minuteSec;beep(cue===30?1200:1600,220);speakEmomCue(`${cue} seconds`);toast(`EMOM · ${cue} seconds`)}if(timer.mode==='Tabata'){const old=Math.floor(timer.elapsed),newSec=Math.floor(elapsed);if(newSec>old&&Math.floor(newSec/(timer.work+timer.rest))!==Math.floor(old/(timer.work+timer.rest)))beep(850,260);else if(newSec>old&&Math.floor(newSec%(timer.work+timer.rest))===timer.work)beep(440,220)}if(elapsed>=totalTime()){timer.elapsed=totalTime();timer.state='done';clearInterval(timer.interval);beep(980,650);saveResult();toast('¡WOD finalizado!');render();return}}const c=document.querySelector('#clock');if(c)c.textContent=fmt(elapsedNow());const s=document.querySelector('#subclock');if(s)s.textContent=subclockText();const st=document.querySelector('#status');if(st)st.textContent=timer.state==='countdown'?'Preparación':timer.state==='running'?'En curso':timer.state==='paused'?'Pausado':timer.state==='done'?'Finalizado':'Listo para iniciar';const b=document.querySelector('#start');if(b)b.textContent=timer.state==='running'?'Pausar':timer.state==='paused'?'Reanudar':'Iniciar WOD';for(const id of ['duration','work','rest','rounds']){const el=document.querySelector('#'+id);if(el)el.disabled=['running','countdown'].includes(timer.state)}const lap=document.querySelector('#lap');if(lap)lap.disabled=timer.state!=='running';const finishBtn=document.querySelector('#finish');if(finishBtn)finishBtn.disabled=!['running','paused'].includes(timer.state)}
function saveResult(){if(timer.wodId){db.results.push({id:uid(),wodId:timer.wodId,studentId:me.studentId||null,time:Math.floor(timer.elapsed||elapsedNow()),laps:timer.laps.slice(),date:new Date().toISOString()});save()}}function finish(){if(!['running','paused'].includes(timer.state))return;timer.elapsed=elapsedNow();timer.state='done';clearInterval(timer.interval);saveResult();render();toast('Resultado guardado')}
function modal(title,html,done){const b=document.createElement('div');b.className='modalback';b.innerHTML=`<section class="modal"><div class="modalhead"><h2>${title}</h2><button class="btn" data-close>×</button></div>${html}</section>`;document.body.append(b);b.onclick=e=>{if(e.target===b||e.target.closest('[data-close]'))b.remove()};b.querySelector('form').onsubmit=e=>{e.preventDefault();done(new FormData(e.target),b)}}
function wodModal(w,date=today()){modal(w?'Editar WOD':'Programar WOD',`<form><div class="formgrid"><div class="field"><label>Nombre</label><input class="input" name="title" required value="${esc(w?.title||'')}"></div><div class="field"><label>Disciplina</label><select class="select" name="type"><option>Hyrox</option><option>CrossFit</option><option>ATHX</option></select></div><div class="field"><label>Modalidad</label><select class="select" name="modality"><option>For Time</option><option>AMRAP</option><option>EMOM</option><option>Tabata</option></select></div><div class="field"><label>Fecha</label><input class="input" type="date" name="date" value="${esc(w?.date||date)}"></div><div class="field"><label>Duración (min)</label><input class="input" name="duration" type="number" min="1" max="240" value="${Number(w?.duration)||20}"></div><div class="field wide"><label>Detalles</label><textarea class="area" name="details" required rows="4">${esc(w?.details||'')}</textarea></div><div class="field wide"><label>Asignar a alumno (opcional)</label><select class="select" name="studentId"><option value="">WOD general de clase</option>${db.students.map(s=>`<option value="${esc(s.id)}" ${w?.studentId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div></div><p style="text-align:right"><button class="btn gold">Guardar</button></p></form>`,(f,b)=>{const item={id:w?.id||uid(),title:f.get('title'),type:f.get('type'),modality:f.get('modality'),date:f.get('date'),duration:Number(f.get('duration'))||20,details:f.get('details'),studentId:f.get('studentId')};if(w)db.wods=db.wods.map(x=>x.id===w.id?item:x);else db.wods.unshift(item);save();b.remove();render();toast('WOD guardado')})}
function bindWods(ws){document.querySelector('#newWod')?.addEventListener('click',()=>wodModal(null));const search=document.querySelector('#search');search.oninput=()=>{const q=search.value.toLowerCase(),list=ws.filter(w=>(w.title+' '+w.details).toLowerCase().includes(q));document.querySelector('#wodCards').innerHTML=wodCards(list);bindCardActions()};bindCardActions()}function bindCardActions(){document.querySelectorAll('[data-timer]').forEach(b=>b.onclick=()=>{const w=db.wods.find(x=>x.id===b.dataset.timer);timer.wodId=b.dataset.timer;timer.duration=Number(w?.duration)||20;view='timer';timer.state='idle';render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>wodModal(db.wods.find(x=>x.id===b.dataset.edit)));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar este WOD?')){db.wods=db.wods.filter(w=>w.id!==b.dataset.del);save();render()}})}
function bindCalendar(){document.querySelector('#prev').onclick=()=>{calendarDate.setMonth(calendarDate.getMonth()-1);render()};document.querySelector('#next').onclick=()=>{calendarDate.setMonth(calendarDate.getMonth()+1);render()};document.querySelector('#today').onclick=()=>{calendarDate=new Date();selectedDate=today();render()};document.querySelectorAll('[data-day]').forEach(d=>d.onclick=e=>{if(!e.target.closest('[data-calwod]')){selectedDate=d.dataset.day;render()}});document.querySelectorAll('[data-calwod]').forEach(b=>b.onclick=e=>{e.stopPropagation();const w=db.wods.find(x=>x.id===b.dataset.calwod);if(w&&isCoach())wodModal(w);else if(w){selectedDate=w.date;render()}});document.querySelector('#addDay')?.addEventListener('click',()=>wodModal(null,selectedDate));document.querySelector('#newWod')?.addEventListener('click',()=>wodModal(null,selectedDate));bindCardActions()}
function bindStudents(){document.querySelector('#addStudent').onclick=()=>modal('Agregar alumno',`<form><div class="field"><label>Nombre</label><input class="input" name="name" required></div><div class="field"><label>Usuario</label><input class="input" name="username" required></div><div class="field"><label>Contraseña</label><input class="input" name="password" type="password" required></div><div class="field"><label>Nivel</label><input class="input" name="level" value="Intermedio"></div><button class="btn gold">Crear alumno</button></form>`,(f,b)=>{const username=f.get('username').toLowerCase().trim();if(db.users.some(u=>u.username.toLowerCase()===username)){toast('Usuario ya existe');return}const s={id:uid(),name:f.get('name'),username,level:f.get('level')};db.students.push(s);db.users.push({name:s.name,username,password:f.get('password'),role:'athlete',studentId:s.id});save();b.remove();render()})}
try{db=JSON.parse(localStorage.getItem(KEY))||seed();if(!db.users||!db.wods)db=seed();db.results=db.results||[];db.wods.forEach(w=>{if(w.studentIds&&!w.studentId)w.studentId=w.studentIds[0]||'';w.duration=Number(w.duration)||20})}catch{db=seed()}save();render()
})();
</script></body></html>
