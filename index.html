<style>
:root{color-scheme:dark;--bg:#090909;--surface:#121212;--line:#30291c;--gold:#d5b56d;--gold2:#f0d99c;--white:#f5f3ed;--muted:#a19c90;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--white);background:radial-gradient(ellipse at 50% -18%,#43351b66,transparent 50%),var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.wrap{width:min(1120px,calc(100% - 40px));margin:auto}.top{min-height:76px;border-bottom:1px solid #ffffff16;background:#090909ed;position:sticky;top:0;z-index:3;backdrop-filter:blur(15px)}.topin{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.13em}.mark{width:39px;height:39px;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-family:Georgia,serif;font-size:1.35rem}.brand small{display:block;color:var(--muted);font-size:.58rem;letter-spacing:.23em;font-weight:600;margin-top:3px}.brand b{color:var(--gold2)}.nav,.actions{display:flex;align-items:center;gap:8px}.nav button,.btn{border:1px solid var(--line);border-radius:3px;padding:10px 14px;background:#141414;color:var(--white);font-size:.8rem;letter-spacing:.04em;font-weight:750}.nav button.active,.btn.gold{background:var(--gold);border-color:var(--gold);color:#17130a}.btn:hover,.nav button:hover{border-color:var(--gold)}.btn:disabled{opacity:.42;cursor:not-allowed}.user{font-size:.78rem;color:var(--muted)}main{padding:42px 0 70px}.kicker{color:var(--gold);font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;font-weight:800}.hero{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}.hero h1{font-family:Georgia,serif;font-size:clamp(2.4rem,6vw,4.7rem);font-weight:400;letter-spacing:-.045em;line-height:.98;margin:13px 0}.hero h1 em{color:var(--gold);font-style:normal}.hero p{color:var(--muted);max-width:530px;line-height:1.65;margin:10px 0 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:26px 0}.stat,.card,.panel{background:linear-gradient(145deg,#161616,#101010);border:1px solid var(--line)}.stat{padding:17px}.stat label{font-size:.67rem;color:var(--muted);text-transform:uppercase;letter-spacing:.13em}.stat strong{display:block;margin-top:9px;font:1.8rem Georgia,serif;color:var(--gold2)}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 14px}.bar h2,.panel h2{font:1.5rem Georgia,serif;margin:0}.input,.select,.area{background:#0d0d0d;border:1px solid #393329;color:var(--white);padding:11px 12px;border-radius:2px;outline:none}.input:focus,.select:focus,.area:focus{border-color:var(--gold)}.search{width:min(230px,48vw)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{padding:20px}.cardtop{display:flex;justify-content:space-between;align-items:center;gap:8px}.tag{color:var(--gold);border:1px solid #b89a5b66;padding:5px 9px;font-size:.67rem;letter-spacing:.13em;text-transform:uppercase}.date,.muted{color:var(--muted);font-size:.8rem}.card h3{font:1.42rem Georgia,serif;margin:15px 0 6px}.detail{white-space:pre-wrap;line-height:1.6;color:#ddd8cd;background:#0c0c0c;border-left:2px solid var(--gold);padding:12px 14px;margin:15px 0;font-size:.86rem}.cardfoot{display:flex;justify-content:space-between;align-items:center;gap:8px}.panel{padding:20px;margin-top:20px}.timer{margin:18px auto;background:#0d0d0d;border:1px solid #645331;padding:clamp(20px,5vw,42px);text-align:center;max-width:820px}.timerline{display:flex;justify-content:space-between;align-items:center;gap:12px}.clock{font:clamp(4rem,13vw,8.5rem)/1 ui-monospace,SFMono-Regular,monospace;letter-spacing:-.08em;color:var(--gold2);margin:38px 0 12px;font-variant-numeric:tabular-nums}.status{font-size:.7rem;color:var(--gold);letter-spacing:.2em;text-transform:uppercase}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin:23px 0}.controls .btn{min-width:145px;padding:14px}.laps{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.lap{font-size:.77rem;color:var(--muted);border:1px solid #ffffff16;padding:7px 10px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{text-align:left;padding:12px;border-bottom:1px solid #ffffff16}th{font-size:.67rem;color:var(--gold);text-transform:uppercase;letter-spacing:.13em}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(430px,100%);background:var(--surface);border:1px solid var(--line);padding:32px}.loginbox h1{font:2.5rem Georgia,serif;margin:30px 0 5px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:.75rem;color:var(--muted)}.loginbox .btn{width:100%;margin-top:8px}.notice{font-size:.76rem;line-height:1.55;border-left:2px solid var(--gold);background:#d5b56d0d;color:#d4c8ad;padding:11px 13px;margin:14px 0}.students{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.student{background:var(--surface);border:1px solid var(--line);padding:16px}.student b{display:block;margin-bottom:7px}.modalback{position:fixed;inset:0;background:#000c;z-index:8;display:grid;place-items:center;padding:16px}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--gold);padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{font:1.6rem Georgia,serif}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gold);color:#17130a;padding:11px 16px;z-index:20;font-weight:800}.foot{text-align:center;color:#756f62;font-size:.72rem;margin-top:28px}.empty{grid-column:1/-1;text-align:center;padding:40px;border:1px dashed var(--line);color:var(--muted)}.calendar{background:#111;border:1px solid var(--line)}.calhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-bottom:1px solid var(--line)}.calmonth{font:1.35rem Georgia,serif;color:var(--gold2)}.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekday{padding:10px 4px;text-align:center;color:var(--gold);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line)}.day{min-height:112px;padding:7px;border-right:1px solid #ffffff0c;border-bottom:1px solid #ffffff0c;overflow:hidden}.day.other{opacity:.36}.day.today{background:#d5b56d0c;box-shadow:inset 0 0 0 1px #d5b56d66}.daynum{font-size:.75rem;color:#ddd8cd;margin-bottom:6px}.daywod{display:block;width:100%;text-align:left;border:1px solid #b89a5b55;background:#d5b56d12;color:var(--gold2);padding:4px 5px;margin:3px 0;font-size:.65rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.daywod.studentwod{border-color:#ffffff30;background:#ffffff0b;color:#eee}.selectedday{margin-top:16px}.selectedday h3{font:1.2rem Georgia,serif;color:var(--gold2)}@media(max-width:720px){.wrap{width:calc(100% - 28px)}.topin{padding:12px 0;flex-wrap:wrap}.nav{order:3;width:100%}.nav button{flex:1;padding:9px 5px}.stats{grid-template-columns:repeat(2,1fr)}.hero{align-items:flex-start;flex-direction:column}.grid,.students{grid-template-columns:1fr}.bar{align-items:flex-start;flex-direction:column}.timerline{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.actions{flex-wrap:wrap}.day{min-height:82px;padding:4px}.daywod{font-size:.56rem;padding:3px}.weekday{font-size:.56rem;padding:7px 1px}.calhead{flex-wrap:wrap}.calmonth{font-size:1.1rem}}
</style>

<body><div id="root"></div><div id="toast" class="toast hidden"></div>
<script>
(()=>{const KEY='wodbohx.v1',today=()=>new Date().toISOString().slice(0,10),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),seed=()=>({users:[{name:'Coach WODBOHX',username:'coach',password:'coach123',role:'coach'},{name:'Alumno Demo',username:'alumno',password:'alumno123',role:'athlete',studentId:'demo'}],students:[{id:'demo',name:'Alumno Demo',username:'alumno',level:'Intermedio'}],wods:[{id:'1',title:'Engine & estaciones',type:'Hyrox',modality:'For Time',date:today(),details:'4 rondas:\n• 500 m carrera\n• 20 wall balls\n• 12 burpees',studentId:''},{id:'2',title:'Fuerza y capacidad',type:'CrossFit',modality:'AMRAP',date:today(),details:'12 minutos:\n• 10 deadlifts\n• 12 push-ups\n• 14 box step-ups',studentId:''},{id:'3',title:'ATHX — Power endurance',type:'ATHX',modality:'For Time',date:today(),details:'3 rondas:\n• 400 m run\n• 15 dumbbell snatches\n• 20 m farmer carry',studentId:''}],results:[]});let db,me=null,view='wods',calendarDate=new Date(),selectedDate=today(),timer={state:'idle',mode:'For Time',elapsed:0,start:0,countdownEnd:0,lastBeep:null,laps:[],wodId:'',interval:null};const root=document.querySelector('#root');function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),2400)}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function login(){root.innerHTML=`<main class="login"><section class="loginbox"><div class="brand"><div class="mark">W</div><div>WOD<b>BOHX</b><small>PERFORMANCE CLUB</small></div></div><h1>Train with purpose.</h1><p class="muted">Accede a tus entrenamientos y resultados.</p><form id="login"><div class="field"><label>USUARIO</label><input class="input" name="u" required autocomplete="username"></div><div class="field"><label>CONTRASEÑA</label><input class="input" name="p" type="password" required autocomplete="current-password"></div><button class="btn gold">INGRESAR →</button></form><div class="notice">Prototipo local: Coach <b>coach / coach123</b> · Alumno <b>alumno / alumno123</b>. Los datos viven solo en este navegador; no uses contraseñas reales ni información sensible.</div></section></main>`;document.querySelector('#login').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);me=db.users.find(x=>x.username.toLowerCase()===f.get('u').trim().toLowerCase()&&x.password===f.get('p'));if(!me){toast('Usuario o contraseña incorrectos');return}render()}}function isCoach(){return me?.role==='coach'}function visibleWods(){return me?.role==='athlete'?db.wods.filter(w=>!w.studentId||w.studentId===me.studentId):db.wods}function render(){if(!me){login();return}let wods=visibleWods();root.innerHTML=`<header class="top"><div class="wrap topin"><div class="brand"><div class="mark">W</div><div>WOD<b>BOHX</b><small>PERFORMANCE CLUB</small></div></div><nav class="nav"><button data-view="wods" class="${view==='wods'?'active':''}">WODs</button><button data-view="calendar" class="${view==='calendar'?'active':''}">Calendario</button><button data-view="timer" class="${view==='timer'?'active':''}">Cronómetro</button>${isCoach()?`<button data-view="students" class="${view==='students'?'active':''}">Alumnos</button>`:''}</nav><div class="actions"><span class="user">${esc(me.name)}</span><button class="btn" id="logout">Salir</button></div></div></header><main class="wrap"><section class="hero"><div><div class="kicker">HYROX · CROSSFIT · ATHX</div><h1>Train. Track. <em>Repeat.</em></h1><p>Tu entrenamiento, tus parciales y tu progreso. Diseñado para quienes dan una vuelta más.</p></div>${isCoach()&&['wods','calendar'].includes(view)?'<button class="btn gold" id="new">＋ Programar WOD</button>':''}</section>${view==='wods'?wodsView(wods):view==='calendar'?calendarView(wods):view==='timer'?timerView(wods):studentsView()}<div class="foot">WODBOHX · Entrena con intención</div></main>`;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelector('#logout').onclick=()=>{me=null;clearInterval(timer.interval);login()};if(view==='wods')bindWods(wods);if(view==='calendar')bindCalendar(wods);if(view==='timer')bindTimer(wods);if(view==='students')document.querySelector('#addStudent').onclick=studentModal}
function wodsView(wods){return `<section class="stats"><div class="stat"><label>WODs</label><strong>${wods.length}</strong></div><div class="stat"><label>HYROX</label><strong>${db.wods.filter(w=>w.type==='Hyrox').length}</strong></div><div class="stat"><label>CROSSFIT</label><strong>${db.wods.filter(w=>w.type==='CrossFit').length}</strong></div><div class="stat"><label>ATHX</label><strong>${db.wods.filter(w=>w.type==='ATHX').length}</strong></div></section><div class="bar"><h2>${isCoach()?'WOD programados':'Mis entrenamientos'}</h2><div class="actions"><input id="search" class="input search" placeholder="Buscar entrenamiento"><select id="filter" class="select"><option>Todos</option><option>Hyrox</option><option>CrossFit</option><option>ATHX</option></select></div></div><section id="cards" class="grid">${cards(wods)}</section><section class="panel"><h2>Resultados recientes</h2>${results()}</section>`}function cards(list){return list.length?list.map(w=>`<article class="card"><div class="cardtop"><span class="tag">${esc(w.type)}</span><span class="date">${esc(w.date)}</span></div><h3>${esc(w.title)}</h3><span class="muted">${esc(w.modality)}${w.studentId?' · asignado a alumno':''}</span><div class="detail">${esc(w.details)}</div><div class="cardfoot"><span class="muted">${w.studentId?'WOD PERSONAL':'WOD DE CLASE'}</span><div class="actions"><button class="btn" data-timer="${esc(w.id)}">⏱ Iniciar</button>${isCoach()?`<button class="btn" data-edit="${esc(w.id)}">Editar</button><button class="btn" data-del="${esc(w.id)}">×</button>`:''}</div></div></article>`).join(''):'<div class="empty">No se encontraron WODs.</div>'}function results(){let rows=db.results.filter(r=>isCoach()||r.studentId===me.studentId).slice().reverse().slice(0,8);return rows.length?`<div class="tablewrap"><table><thead><tr><th>Entrenamiento</th>${isCoach()?'<th>Alumno</th>':''}<th>Tiempo</th><th>Vueltas</th><th>Fecha</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(db.wods.find(w=>w.id===r.wodId)?.title||'WOD')}</td>${isCoach()?`<td>${esc(db.students.find(s=>s.id===r.studentId)?.name||'')}</td>`:''}<td>${fmt(r.time)}</td><td>${r.laps.length}</td><td>${new Date(r.date).toLocaleDateString('es-CL')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Todavía no hay resultados guardados.</p>'}function studentsView(){return `<div class="bar"><h2>Alumnos (${db.students.length})</h2><button id="addStudent" class="btn gold">＋ Agregar alumno</button></div><div class="notice">Los datos de alumnos se almacenan localmente en este navegador; esta versión no ofrece cuentas protegidas ni sincronización online.</div><section class="students">${db.students.map(s=>`<article class="student"><b>${esc(s.name)}</b><span class="muted">@${esc(s.username)} · ${esc(s.level)}</span></article>`).join('')||'<div class="empty">Aún no hay alumnos.</div>'}</section><section class="panel"><h2>Resultados recientes</h2>${results()}</section>`}function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function calendarView(wods){const year=calendarDate.getFullYear(),month=calendarDate.getMonth(),first=new Date(year,month,1),offset=(first.getDay()+6)%7,start=new Date(year,month,1-offset),monthName=calendarDate.toLocaleDateString('es-CL',{month:'long',year:'numeric'});let cells='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let key=dateKey(d),dayWods=wods.filter(w=>w.date===key);cells+=`<div class="day ${d.getMonth()!==month?'other':''} ${key===today()?'today':''}"><div class="daynum">${d.getDate()}</div>${dayWods.slice(0,3).map(w=>`<button class="daywod ${w.studentId?'studentwod':''}" data-calendar-wod="${esc(w.id)}" title="${esc(w.title)}${w.studentId?' — alumno':''}">${w.studentId?'● ':''}${esc(w.title)}</button>`).join('')}${dayWods.length>3?`<span class="muted">+${dayWods.length-3} más</span>`:''}</div>`}let dayItems=wods.filter(w=>w.date===selectedDate);return `<div class="bar"><h2>Calendario de entrenamientos</h2><span class="muted">WODs de clases y asignados a alumnos</span></div><section class="calendar"><div class="calhead"><button id="prevMonth" class="btn">←</button><strong class="calmonth">${esc(monthName)}</strong><div class="actions"><button id="todayMonth" class="btn">Hoy</button><button id="nextMonth" class="btn">→</button></div></div><div class="calgrid">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div></section><section class="panel selectedday"><h3>WODs · ${new Date(selectedDate+'T12:00:00').toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h3><div class="grid">${cards(dayItems)}</div>${!dayItems.length?'<p class="muted">No hay WODs programados para este día.</p>':''}</section>`}function bindCalendar(wods){document.querySelector('#prevMonth').onclick=()=>{calendarDate.setMonth(calendarDate.getMonth()-1);render()};document.querySelector('#nextMonth').onclick=()=>{calendarDate.setMonth(calendarDate.getMonth()+1);render()};document.querySelector('#todayMonth').onclick=()=>{calendarDate=new Date();selectedDate=today();render()};document.querySelectorAll('[data-calendar-wod]').forEach(b=>b.onclick=()=>{let w=db.wods.find(x=>x.id===b.dataset.calendarWod);if(w){selectedDate=w.date;render()}});document.querySelector('#new')?.addEventListener('click',()=>wodModal(null,selectedDate))}
function fmt(s){s=Math.floor(Math.max(0,s));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}function elapsedNow(){return timer.state==='running'?timer.elapsed+(performance.now()-timer.start)/1000:timer.elapsed}function shown(){if(timer.state==='countdown')return `T-${Math.max(1,Math.ceil((timer.countdownEnd-Date.now())/1000))}`;return fmt(elapsedNow())}function timerView(wods){return `<section class="timer"><div class="timerline"><div><div class="kicker">WOD TIMER</div><div class="muted" style="margin-top:8px">${esc(db.wods.find(w=>w.id===timer.wodId)?.title||'Cronómetro libre')}</div></div><div class="actions"><select id="timerWod" class="select"><option value="">Cronómetro libre</option>${wods.map(w=>`<option value="${esc(w.id)}" ${timer.wodId===w.id?'selected':''}>${esc(w.title)}</option>`).join('')}</select><select id="mode" class="select"><option>For Time</option><option>AMRAP</option></select></div></div><div id="status" class="status">${timer.state==='running'?'En curso':timer.state==='countdown'?'Prepárate':timer.state==='paused'?'Pausado':'Listo para iniciar'}</div><div id="clock" class="clock">${shown()}</div><div class="muted">Cuenta regresiva sonora T-3, T-2, T-1 y señal de inicio en T-0.</div><div class="controls"><button id="start" class="btn gold">${timer.state==='running'?'Pausar':timer.state==='paused'?'Reanudar':'Iniciar WOD'}</button><button id="lap" class="btn" ${timer.state!=='running'?'disabled':''}>＋ Vuelta</button><button id="finish" class="btn" ${!['running','paused'].includes(timer.state)?'disabled':''}>Finalizar</button><button id="reset" class="btn">Reiniciar</button></div><div class="laps">${timer.laps.map((x,i)=>`<span class="lap">Vuelta ${i+1} · ${fmt(x)}</span>`).join('')}</div></section><section class="panel"><h2>Resultados recientes</h2>${results()}</section>`}let audioContext=null;function tone(frequency=700,duration=120){try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();let oscillator=audioContext.createOscillator(),gain=audioContext.createGain();oscillator.type='sine';oscillator.frequency.value=frequency;gain.gain.setValueAtTime(.17,audioContext.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duration/1000);oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start();oscillator.stop(audioContext.currentTime+duration/1000)}catch(e){console.warn('El navegador no permitió reproducir el sonido',e)}}function bindTimer(){document.querySelector('#timerWod').onchange=e=>timer.wodId=e.target.value;document.querySelector('#mode').value=timer.mode;document.querySelector('#mode').onchange=e=>timer.mode=e.target.value;document.querySelector('#start').onclick=()=>{if(timer.state==='running'){timer.elapsed=elapsedNow();timer.state='paused';clearInterval(timer.interval)}else if(timer.state==='paused'){timer.state='running';timer.start=performance.now()}else{timer.elapsed=0;timer.laps=[];timer.countdownEnd=Date.now()+3000;timer.lastBeep=null;timer.state='countdown';clearInterval(timer.interval);timer.interval=setInterval(tick,40)}render()};document.querySelector('#lap').onclick=()=>{if(timer.state!=='running')return;timer.laps.push(Math.floor(elapsedNow()));render()};document.querySelector('#finish').onclick=finish;document.querySelector('#reset').onclick=()=>{clearInterval(timer.interval);timer.state='idle';timer.elapsed=0;timer.laps=[];timer.lastBeep=null;render()}}function tick(){if(timer.state==='countdown'){let remain=Math.max(0,Math.ceil((timer.countdownEnd-Date.now())/1000));if(remain<=3&&remain>0&&timer.lastBeep!==remain){timer.lastBeep=remain;tone(520,115)}if(remain===0){timer.state='running';timer.start=performance.now();timer.lastBeep=0;tone(980,360);toast('¡WOD en marcha!')}}let c=document.querySelector('#clock');if(c)c.textContent=shown();let s=document.querySelector('#status');if(s)s.textContent=timer.state==='countdown'?'Prepárate':timer.state==='running'?'En curso':timer.state==='paused'?'Pausado':'Listo para iniciar';let lap=document.querySelector('#lap');if(lap)lap.disabled=timer.state!=='running';let f=document.querySelector('#finish');if(f)f.disabled=!['running','paused'].includes(timer.state);let st=document.querySelector('#start');if(st)st.textContent=timer.state==='running'?'Pausar':timer.state==='paused'?'Reanudar':'Iniciar WOD'}function finish(){if(!['running','paused'].includes(timer.state))return;timer.elapsed=elapsedNow();timer.state='done';clearInterval(timer.interval);if(timer.wodId){db.results.push({wodId:timer.wodId,studentId:me.studentId||null,time:Math.floor(timer.elapsed),laps:timer.laps,date:new Date().toISOString()});save()}render();toast('Resultado guardado')}
function modal(title,html,done){let b=document.createElement('div');b.className='modalback';b.innerHTML=`<section class="modal"><div class="modalhead"><h2>${title}</h2><button class="btn" data-close>×</button></div>${html}</section>`;document.body.append(b);b.onclick=e=>{if(e.target===b||e.target.closest('[data-close]'))b.remove()};b.querySelector('form').onsubmit=e=>{e.preventDefault();done(new FormData(e.target),b)}}function wodModal(w,defaultDate=today()){modal(w?'Editar WOD':'Programar WOD',`<form><div class="formgrid"><div class="field"><label>Nombre</label><input class="input" name="title" required value="${esc(w?.title||'')}"></div><div class="field"><label>Disciplina</label><select class="select" name="type"><option ${w?.type==='Hyrox'?'selected':''}>Hyrox</option><option ${w?.type==='CrossFit'?'selected':''}>CrossFit</option><option ${w?.type==='ATHX'?'selected':''}>ATHX</option></select></div><div class="field"><label>Modalidad</label><select class="select" name="modality"><option>For Time</option><option>AMRAP</option><option>EMOM</option><option>Tabata</option></select></div><div class="field"><label>Fecha</label><input class="input" type="date" name="date" value="${esc(w?.date||defaultDate)}"></div><div class="field wide"><label>Detalles</label><textarea class="area" name="details" rows="5" required>${esc(w?.details||'')}</textarea></div><div class="field wide"><label>Asignar a alumno (opcional)</label><select class="select" name="studentId"><option value="">WOD de clase — todos</option>${db.students.map(s=>`<option value="${esc(s.id)}" ${w?.studentId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><span class="muted">Los WODs asignados aparecen en el calendario del alumno seleccionado.</span></div></div><p style="text-align:right"><button class="btn gold">Guardar</button></p></form>`,(f,b)=>{let item={id:w?.id||uid(),title:f.get('title'),type:f.get('type'),modality:f.get('modality'),date:f.get('date'),details:f.get('details'),studentId:f.get('studentId')};if(w)db.wods=db.wods.map(x=>x.id===w.id?item:x);else db.wods.unshift(item);save();b.remove();render();toast('WOD guardado en el calendario')})}function studentModal(){modal('Agregar alumno',`<form><div class="field"><label>Nombre</label><input class="input" name="name" required></div><div class="field"><label>Usuario</label><input class="input" name="username" required></div><div class="field"><label>Contraseña inicial</label><input class="input" type="password" name="password" minlength="6" required></div><div class="field"><label>Nivel</label><select class="select" name="level"><option>Principiante</option><option selected>Intermedio</option><option>Avanzado</option><option>Competidor</option></select></div><p class="notice">Cuenta local de demostración; no es autenticación segura.</p><p style="text-align:right"><button class="btn gold">Crear alumno</button></p></form>`,(f,b)=>{let u=f.get('username').trim().toLowerCase();if(db.users.some(x=>x.username.toLowerCase()===u)){toast('Usuario ya existe');return}let s={id:uid(),name:f.get('name'),username:u,level:f.get('level')};db.students.push(s);db.users.push({name:s.name,username:u,password:f.get('password'),role:'athlete',studentId:s.id});save();b.remove();render()})}function bindWods(wods){document.querySelector('#new')?.addEventListener('click',()=>wodModal(null));function filter(){let q=document.querySelector('#search').value.toLowerCase(),type=document.querySelector('#filter').value;let shown=wods.filter(w=>(type==='Todos'||w.type===type)&&(`${w.title} ${w.details}`.toLowerCase().includes(q)));document.querySelector('#cards').innerHTML=cards(shown);bindCards()}document.querySelector('#search').oninput=filter;document.querySelector('#filter').onchange=filter;bindCards()}function bindCards(){document.querySelectorAll('[data-timer]').forEach(b=>b.onclick=()=>{timer.wodId=b.dataset.timer;view='timer';timer.state='idle';render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>wodModal(db.wods.find(w=>w.id===b.dataset.edit)));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar este WOD?')){db.wods=db.wods.filter(w=>w.id!==b.dataset.del);save();render()}})}
try{db=JSON.parse(localStorage.getItem(KEY))||seed();if(!db.users||!db.wods)db=seed();db.results=db.results||[];db.wods.forEach(w=>{if(w.studentIds&&!w.studentId)w.studentId=w.studentIds[0]||''})}catch{db=seed()}save();render()})();
</script></body></html>
