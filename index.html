<html lang="es">
<head>

  <meta name="theme-color" content="#10130f">
  <title>WODBOHX — Entrena. Registra. Supera.</title>
  <style>
    :root{color-scheme:dark;--bg:#10130f;--panel:#191e18;--panel2:#20271f;--line:#30392f;--text:#eff4e9;--muted:#a2ad9d;--lime:#c8f169;--lime2:#d8ff85;--orange:#f2a66b;--red:#ff7777;--radius:18px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -10%,#293622 0,transparent 38%),var(--bg);color:var(--text);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:.82rem}.wrap{max-width:1180px;margin:auto;padding:0 24px}.topbar{height:74px;border-bottom:1px solid #ffffff12;background:#10130feF;position:sticky;top:0;z-index:5;backdrop-filter:blur(16px)}.topinner{height:100%;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:-.06em;font-size:1.35rem}.brandmark{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:var(--lime);color:#182012;font-size:1.2rem}.brand span{color:var(--lime)}.top-actions,.nav,.row,.actions{display:flex;align-items:center;gap:10px}.nav{padding:5px;border:1px solid var(--line);border-radius:14px;background:#ffffff06}.nav button{background:transparent;color:var(--muted);border:0;padding:9px 13px;border-radius:10px;font-weight:700;font-size:.86rem}.nav button.active{background:var(--panel2);color:var(--lime)}.button{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:12px;font-weight:750;transition:.15s}.button:hover{border-color:#82916f;transform:translateY(-1px)}.button.primary{background:var(--lime);border-color:var(--lime);color:#192013}.button.danger{color:var(--red)}.iconbtn{background:transparent;border:0;color:var(--muted);font-size:1.15rem;padding:6px}.main{padding-top:32px;padding-bottom:72px}.eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--lime);font-weight:850}.hero{display:flex;justify-content:space-between;align-items:end;gap:24px;margin:10px 0 25px}.hero h1{font-size:clamp(2rem,4vw,3.35rem);letter-spacing:-.065em;line-height:1;margin:8px 0 12px}.hero p{margin:0;color:var(--muted);max-width:580px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:22px}.stat,.card,.panel{background:linear-gradient(145deg,#1b211a,#151a14);border:1px solid var(--line);border-radius:var(--radius)}.stat{padding:17px 19px}.stat label{display:block;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;font-weight:800}.stat strong{display:block;font-size:1.8rem;letter-spacing:-.05em;margin-top:8px}.stat strong.accent{color:var(--lime)}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:20px 0 15px}.toolbar h2{margin:0;font-size:1.25rem;letter-spacing:-.03em}.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.input,.select,.textarea{background:#10140f;border:1px solid var(--line);border-radius:11px;color:var(--text);padding:11px 12px;outline:none;width:100%}.input:focus,.select:focus,.textarea:focus{border-color:var(--lime)}.filters .input{width:min(250px,52vw)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.wod{padding:19px}.wodhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid #c8f16955;background:#c8f16914;color:var(--lime);border-radius:99px;padding:5px 10px;font-size:.72rem;text-transform:uppercase;font-weight:850;letter-spacing:.06em}.tag.athx{border-color:#f2a66b66;background:#f2a66b15;color:var(--orange)}.wod h3{margin:13px 0 5px;font-size:1.2rem;letter-spacing:-.03em}.details{white-space:pre-wrap;line-height:1.55;color:#d0d8ca;background:#111610;border-radius:12px;padding:13px;margin:14px 0;font-size:.9rem}.wodfooter{display:flex;justify-content:space-between;align-items:center;gap:8px}.badge{color:var(--muted);font-size:.78rem}.empty{padding:38px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius);grid-column:1/-1}.panel{padding:20px;margin-top:20px}.panel h2{margin:0 0 16px}.students{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.student{padding:15px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}.student strong{display:block;margin-bottom:4px}.timer{margin:22px auto 0;max-width:800px;text-align:center;border-radius:24px;background:linear-gradient(145deg,#232c20,#121610);border:1px solid #48533e;padding:22px}.timerheading{display:flex;justify-content:space-between;align-items:center;gap:12px}.timerdisplay{font-variant-numeric:tabular-nums;font-size:clamp(4rem,12vw,8rem);line-height:1;font-weight:900;letter-spacing:-.075em;margin:28px 0 8px;color:var(--lime)}.timerstatus{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:850}.timer-controls{display:flex;justify-content:center;gap:10px;margin:22px 0 10px;flex-wrap:wrap}.timer-controls .button{min-width:140px;padding:14px 18px}.laps{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}.lap{font-size:.8rem;color:var(--muted);background:#ffffff09;padding:7px 10px;border-radius:9px}.results{width:100%;border-collapse:collapse}.results th,.results td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:.86rem}.results th{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}.login-screen{min-height:100vh;display:grid;place-items:center;padding:22px}.login-card{width:min(440px,100%);padding:30px;background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:0 30px 100px #0008}.login-card h1{margin:22px 0 8px;font-size:2rem;letter-spacing:-.06em}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:.8rem;color:var(--muted);font-weight:750}.login-card .button{width:100%;margin-top:8px}.demo{padding:12px;background:#c8f16912;border:1px solid #c8f16930;border-radius:12px;font-size:.78rem;color:#d3e6ba;line-height:1.6;margin-top:16px}.notice{padding:12px 14px;background:#f2a66b12;border:1px solid #f2a66b40;border-radius:12px;color:#ffd2ae;font-size:.82rem;line-height:1.5;margin:16px 0}.modal-backdrop{position:fixed;inset:0;background:#000b;z-index:10;display:grid;place-items:center;padding:18px}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:21px;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalhead h2{margin:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.span2{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--lime);color:#182012;padding:12px 17px;border-radius:12px;font-weight:800;z-index:20;box-shadow:0 8px 30px #0008}.footnote{margin-top:18px;color:var(--muted);font-size:.76rem;text-align:center}
    @media(max-width:760px){.topbar{height:auto;min-height:68px}.topinner{flex-wrap:wrap;padding:12px 0}.top-actions{margin-left:auto}.nav{order:3;width:100%;justify-content:space-around}.nav button{flex:1;padding:8px 5px}.stats{grid-template-columns:repeat(2,1fr)}.hero{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.students{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}.timerheading{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.wrap{padding:0 16px}}
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script>
  (()=>{
    const KEY='wodbohx.v1';
    const today=()=>new Date().toISOString().slice(0,10);
    const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const initial=()=>({users:[{id:'coach',name:'Coach WODBOHX',username:'coach',role:'coach',studentId:null,passwordHash:'b6c474dc0e2e8c37e0f6f7a43c0d619c0a646183dc960a5c0db94d553c4cc0dc'},{id:'athlete-demo',name:'Alumno Demo',username:'alumno',role:'athlete',studentId:'student-demo',passwordHash:'d1cc57d6a80f70c7bc8ea94af084e888b3920381951f9f73e419d2e0d1dba0a2'}],students:[{id:'student-demo',name:'Alumno Demo',username:'alumno',level:'Intermedio'}],wods:[{id:'wod-1',title:'HYROX — Motor y estaciones',type:'Hyrox',modality:'For Time',date:today(),details:'4 rondas:\n• 500 m carrera\n• 20 wall balls\n• 12 burpees',studentIds:[],createdBy:'coach'},{id:'wod-2',title:'CrossFit — AMRAP 12',type:'CrossFit',modality:'AMRAP',date:today(),details:'12 minutos:\n• 10 deadlifts\n• 12 push-ups\n• 14 box step-ups',studentIds:[],createdBy:'coach'},{id:'wod-3',title:'ATHX — Engine builder',type:'ATHX',modality:'For Time',date:today(),details:'3 rondas:\n• 400 m run\n• 15 dumbbell snatches\n• 20 m farmer carry',studentIds:[],createdBy:'coach'}],results:[]});
    let db,session=null,view='wods',timer={state:'idle',mode:'forTime',startAt:0,elapsed:0,interval:null,countdownEnd:0,laps:[],wodId:null};
    const root=document.getElementById('root');
    function load(){try{const d=JSON.parse(localStorage.getItem(KEY));db=d&&d.users&&d.wods?d:initial()}catch{db=initial()}save()}
    function save(){localStorage.setItem(KEY,JSON.stringify(db))}
    async function hash(text){const bytes=new TextEncoder().encode(text);const digest=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('')}
    function notify(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(notify.timeout);notify.timeout=setTimeout(()=>t.classList.add('hidden'),2400)}
    const isCoach=()=>session?.role==='coach';
    function loginScreen(){root.innerHTML=`<main class="login-screen"><section class="login-card"><div class="brand"><div class="brandmark">W</div><div>WOD<span>BOHX</span></div></div><h1>Tu entrenamiento,<br>en un solo lugar.</h1><p class="muted">Ingresa para consultar tus WODs y registrar tus resultados.</p><form id="loginForm"><div class="field"><label for="username">Usuario</label><input class="input" id="username" autocomplete="username" required placeholder="Tu usuario"></div><div class="field"><label for="password">Contraseña</label><input class="input" id="password" type="password" autocomplete="current-password" required placeholder="Tu contraseña"></div><button class="button primary" type="submit">Ingresar →</button></form><div class="notice">Prototipo: las cuentas y datos se guardan en este navegador. El inicio de sesión no es seguro para producción ni protege los datos de otros usuarios.</div><div class="demo"><b>Acceso de demostración</b><br>Coach: <code>coach</code> / <code>coach123</code><br>Alumno: <code>alumno</code> / <code>alumno123</code></div></section></main>`;
      document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const u=document.getElementById('username').value.trim().toLowerCase(),p=document.getElementById('password').value;const user=db.users.find(x=>x.username.toLowerCase()===u&&x.passwordHash===await hash(p));if(!user){notify('Usuario o contraseña incorrectos');return}session=user;render()};
    }
    function render(){if(!session){loginScreen();return}const athlete=session.role==='athlete';const visibleWods=athlete?db.wods.filter(w=>!w.studentIds?.length||w.studentIds.includes(session.studentId)):db.wods;
      root.innerHTML=`<header class="topbar"><div class="wrap topinner"><div class="brand"><div class="brandmark">W</div><div>WOD<span>BOHX</span></div></div><nav class="nav"><button data-view="wods" class="${view==='wods'?'active':''}">WODs</button><button data-view="timer" class="${view==='timer'?'active':''}">Cronómetro</button>${isCoach()?'<button data-view="students" class="'+(view==='students'?'active':'')+'">Alumnos</button>':''}</nav><div class="top-actions"><span class="small muted">${esc(session.name)}</span><button class="iconbtn" id="logout" title="Cerrar sesión">↪</button></div></div></header><main class="wrap main"><div class="hero"><div><div class="eyebrow">Train · Track · Improve</div><h1>${view==='students'?'Tus atletas. Su progreso.':view==='timer'?'Cada segundo cuenta.':'Entrena. Registra. Supera.'}</h1><p>${view==='students'?'Administra alumnos y sus accesos.':view==='timer'?'Cuenta regresiva de 5 segundos, cronómetro continuo y parciales por vuelta.':'Hyrox, CrossFit y ATHX: programa entrenamientos y conserva cada resultado.'}</p></div>${isCoach()?'<div class="actions"><button class="button" id="export">↓ Exportar datos</button><button class="button" id="import">↑ Importar datos</button><input id="importFile" type="file" accept="application/json" class="hidden"></div>':''}</div>${view==='students'?studentsView():view==='timer'?timerView(visibleWods):wodsView(visibleWods)}<p class="footnote">WODBOHX · Datos locales de este navegador · <a href="README.md">Información sobre almacenamiento y seguridad</a></p></main>`;
      bindCommon();if(view==='timer')bindTimer();if(view==='students')bindStudents();if(view==='wods')bindWods(visibleWods);
    }
    function wodsView(wods){const hyrox=db.wods.filter(x=>x.type==='Hyrox').length,cross=db.wods.filter(x=>x.type==='CrossFit').length,athx=db.wods.filter(x=>x.type==='ATHX').length;return `<section class="stats"><div class="stat"><label>WODs guardados</label><strong>${wods.length}</strong></div><div class="stat"><label>Hyrox</label><strong class="accent">${hyrox}</strong></div><div class="stat"><label>CrossFit</label><strong>${cross}</strong></div><div class="stat"><label>ATHX</label><strong>${athx}</strong></div></section><div class="toolbar"><h2>${isCoach()?'Programación':'Mis WODs'}</h2><div class="filters"><input id="search" class="input" placeholder="Buscar WOD…"><select id="typeFilter" class="select" style="width:auto"><option value="Todos">Todas las disciplinas</option><option>Hyrox</option><option>CrossFit</option><option>ATHX</option></select>${isCoach()?'<button id="newWod" class="button primary">＋ Nuevo WOD</button>':''}</div></div><section class="grid" id="wodGrid">${wods.length?wods.map(w=>wodCard(w)).join(''):'<div class="empty">Todavía no hay WODs disponibles.</div>'}</section><section class="panel"><h2>Mis resultados</h2>${resultsTable()}</section>`}
    function wodCard(w){const tag=w.type==='ATHX'?'tag athx':'tag';const assigned=(w.studentIds||[]).length?` · ${w.studentIds.length} alumno(s)`:' · General';return `<article class="card wod"><div class="wodhead"><span class="${tag}">${esc(w.type)}</span><span class="badge">${esc(w.date||'')}</span></div><h3>${esc(w.title)}</h3><div class="badge">${esc(w.modality)}${isCoach()?esc(assigned):''}</div><div class="details">${esc(w.details)}</div><div class="wodfooter"><span class="badge">${w.resultCount||0} resultados</span><div class="actions"><button class="button" data-time="${esc(w.id)}">⏱ Cronometrar</button>${isCoach()?`<button class="iconbtn" data-edit="${esc(w.id)}" title="Editar">✎</button><button class="iconbtn" data-delete="${esc(w.id)}" title="Eliminar">×</button>`:''}</div></div></article>`}
    function resultsTable(){const rs=db.results.filter(r=>isCoach()||r.studentId===session.studentId).slice().reverse().slice(0,10);if(!rs.length)return '<p class="muted small">Aún no hay resultados. Inicia un WOD para registrar el primero.</p>';return `<div style="overflow:auto"><table class="results"><thead><tr><th>WOD</th>${isCoach()?'<th>Alumno</th>':''}<th>Tiempo</th><th>Vueltas</th><th>Fecha</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${esc(db.wods.find(w=>w.id===r.wodId)?.title||'WOD eliminado')}</td>${isCoach()?`<td>${esc(db.students.find(s=>s.id===r.studentId)?.name||'')}</td>`:''}<td>${formatTime(r.elapsed)}</td><td>${r.laps?.length||0}</td><td>${new Date(r.createdAt).toLocaleDateString('es-CL')}</td></tr>`).join('')}</tbody></table></div>`}
    function studentsView(){return `<div class="toolbar"><h2>Alumnos (${db.students.length})</h2><button class="button primary" id="newStudent">＋ Agregar alumno</button></div><div class="notice">Las credenciales de este prototipo existen solo en este navegador. No uses contraseñas reales ni guardes datos personales aquí.</div><section class="students">${db.students.map(s=>`<article class="student"><strong>${esc(s.name)}</strong><div class="muted small">@${esc(s.username)} · ${esc(s.level||'Sin nivel')}</div><div class="small" style="margin-top:10px">${db.results.filter(r=>r.studentId===s.id).length} resultados registrados</div></article>`).join('')||'<div class="empty">Agrega tu primer alumno.</div>'}</section><section class="panel"><h2>Resultados recientes</h2>${resultsTable()}</section>`}
    function timerView(wods){const chosen=db.wods.find(w=>w.id===timer.wodId);return `<section class="timer"><div class="timerheading"><div><div class="eyebrow">Cronómetro WOD</div><div class="muted small" style="margin-top:6px">${chosen?esc(chosen.title):'Elige un WOD o cronometra libremente'}</div></div><div class="actions"><select id="timerWod" class="select" style="width:auto"><option value="">Cronómetro libre</option>${wods.map(w=>`<option value="${esc(w.id)}" ${timer.wodId===w.id?'selected':''}>${esc(w.title)}</option>`).join('')}</select><select id="timerMode" class="select" style="width:auto"><option value="forTime" ${timer.mode==='forTime'?'selected':''}>For Time</option><option value="amrap" ${timer.mode==='amrap'?'selected':''}>AMRAP</option></select></div></div><div class="timerstatus" id="timerStatus">${timerStatus()}</div><div class="timerdisplay" id="timerDisplay">${displayTime()}</div><div class="muted small" id="timerHint">${timer.state==='countdown'?'Prepárate — comienza en T-5':timer.state==='running'?'El tiempo sigue corriendo mientras registras vueltas':'Pulsa iniciar para comenzar con cuenta regresiva T-5'}</div><div class="timer-controls"><button class="button primary" id="startTimer">${timer.state==='running'?'Pausar':timer.state==='paused'?'Reanudar':'Iniciar WOD'}</button><button class="button" id="lapTimer" ${timer.state!=='running'?'disabled':''}>＋ Registrar vuelta</button><button class="button" id="finishTimer" ${timer.state!=='running'&&timer.state!=='paused'?'disabled':''}>Finalizar</button><button class="button" id="resetTimer">Reiniciar</button></div><div id="laps" class="laps">${timer.laps.map((l,i)=>`<span class="lap">Vuelta ${i+1} · ${formatTime(l)}</span>`).join('')}</div></section><section class="panel"><h2>Mis resultados</h2>${resultsTable()}</section>`}
    function formatTime(s){s=Math.max(0,Math.floor(s));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
    function elapsedNow(){return timer.state==='running'?timer.elapsed+(performance.now()-timer.startAt)/1000:timer.elapsed}
    function displayTime(){if(timer.state==='countdown')return `T-${Math.max(1,Math.ceil((timer.countdownEnd-Date.now())/1000))}`;if(timer.mode==='amrap')return formatTime(Math.max(0,(timer.amrapSeconds||600)-elapsedNow()));return formatTime(elapsedNow())}
    function timerStatus(){return timer.state==='countdown'?'Preparación':timer.state==='running'?'En curso':timer.state==='paused'?'Pausado':timer.state==='done'?'WOD finalizado':'Listo para iniciar'}
    function timerTick(){if(timer.state==='countdown'){if(Date.now()>=timer.countdownEnd){timer.state='running';timer.startAt=performance.now();beep(760);notify('¡WOD en marcha!')}else beep(440,80)}if(timer.state==='running'&&timer.mode==='amrap'&&elapsedNow()>=(timer.amrapSeconds||600)){timer.elapsed=timer.amrapSeconds||600;timer.state='done';clearInterval(timer.interval);beep(900,600);saveResult();notify('¡Tiempo! Resultado guardado')}updateTimerDisplay()}
    function updateTimerDisplay(){const d=document.getElementById('timerDisplay'),s=document.getElementById('timerStatus'),hint=document.getElementById('timerHint');if(!d)return;d.textContent=displayTime();s.textContent=timerStatus();hint.textContent=timer.state==='countdown'?'Prepárate — comienza en T-5':timer.state==='running'?'El tiempo sigue corriendo mientras registras vueltas':'Pulsa iniciar para comenzar con cuenta regresiva T-5';document.getElementById('lapTimer').disabled=timer.state!=='running';document.getElementById('finishTimer').disabled=!['running','paused'].includes(timer.state);document.getElementById('startTimer').textContent=timer.state==='running'?'Pausar':timer.state==='paused'?'Reanudar':'Iniciar WOD';}
    function bindTimer(){document.getElementById('timerWod').onchange=e=>{timer.wodId=e.target.value||null};document.getElementById('timerMode').onchange=e=>{timer.mode=e.target.value;timer.elapsed=0;updateTimerDisplay()};document.getElementById('startTimer').onclick=()=>{if(timer.state==='running'){timer.elapsed=elapsedNow();timer.state='paused';clearInterval(timer.interval)}else if(timer.state==='paused'){timer.state='running';timer.startAt=performance.now()}else{timer.elapsed=0;timer.laps=[];timer.countdownEnd=Date.now()+5000;timer.state='countdown';clearInterval(timer.interval);timer.interval=setInterval(timerTick,100)}updateTimerDisplay()};document.getElementById('lapTimer').onclick=()=>{if(timer.state!=='running')return;timer.laps.push(Math.floor(elapsedNow()));beep(620,100);render()};document.getElementById('finishTimer').onclick=()=>finishTimer();document.getElementById('resetTimer').onclick=()=>{clearInterval(timer.interval);timer={state:'idle',mode:timer.mode,startAt:0,elapsed:0,interval:null,countdownEnd:0,laps:[],wodId:timer.wodId};render()};}
    function finishTimer(){if(!['running','paused'].includes(timer.state))return;timer.elapsed=Math.floor(elapsedNow());timer.state='done';clearInterval(timer.interval);saveResult();render();notify('Resultado guardado')}
    function saveResult(){if(!timer.wodId)return;db.results.push({id:uid(),wodId:timer.wodId,studentId:session.studentId||null,elapsed:Math.floor(timer.elapsed||elapsedNow()),laps:timer.laps.slice(),createdAt:new Date().toISOString()});save()}
    function beep(freq=520,duration=120){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},duration)}catch{}}
    function bindWods(wods){const search=document.getElementById('search'),filter=document.getElementById('typeFilter');function apply(){const term=search.value.toLowerCase(),type=filter.value;const list=wods.filter(w=>(type==='Todos'||w.type===type)&&(`${w.title} ${w.details}`.toLowerCase().includes(term)));document.getElementById('wodGrid').innerHTML=list.length?list.map(wodCard).join(''):'<div class="empty">No se encontraron WODs.</div>';bindWodActions()}search.oninput=apply;filter.onchange=apply;bindWodActions();document.getElementById('newWod')?.addEventListener('click',()=>wodModal());}
    function bindWodActions(){document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{timer.wodId=b.dataset.time;view='timer';timer.state='idle';render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>wodModal(db.wods.find(w=>w.id===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar este WOD?')){db.wods=db.wods.filter(w=>w.id!==b.dataset.delete);save();render()}})}
    function openModal(title,body,submit){const back=document.createElement('div');back.className='modal-backdrop';back.innerHTML=`<section class="modal"><div class="modalhead"><h2>${title}</h2><button type="button" class="iconbtn" data-close>×</button></div>${body}</section>`;document.body.append(back);back.onclick=e=>{if(e.target===back||e.target.closest('[data-close]'))back.remove()};back.querySelector('form').onsubmit=async e=>{e.preventDefault();await submit(new FormData(e.target),back)};}
    function wodModal(w){const editing=!!w;openModal(editing?'Editar WOD':'Nuevo WOD',`<form><div class="formgrid"><div class="field"><label>Nombre del WOD</label><input class="input" name="title" required value="${esc(w?.title||'')}"></div><div class="field"><label>Disciplina</label><select class="select" name="type"><option ${w?.type==='Hyrox'?'selected':''}>Hyrox</option><option ${w?.type==='CrossFit'?'selected':''}>CrossFit</option><option ${w?.type==='ATHX'?'selected':''}>ATHX</option></select></div><div class="field"><label>Modalidad</label><select class="select" name="modality"><option ${w?.modality==='For Time'?'selected':''}>For Time</option><option ${w?.modality==='AMRAP'?'selected':''}>AMRAP</option><option>EMOM</option><option>Tabata</option></select></div><div class="field"><label>Fecha</label><input class="input" type="date" name="date" value="${esc(w?.date||today())}"></div><div class="field span2"><label>WOD / instrucciones</label><textarea class="textarea" name="details" rows="5" required>${esc(w?.details||'')}</textarea></div><div class="field span2"><label>Asignar a alumno (opcional)</label><select class="select" name="studentId"><option value="">General — todos los alumnos</option>${db.students.map(s=>`<option value="${esc(s.id)}" ${w?.studentIds?.includes(s.id)?'selected':''}>${esc(s.name)}</option>`).join('')}</select><div class="small muted">Si eliges alumno, el WOD solo será visible para esa persona.</div></div></div><div class="form-actions"><button type="button" class="button" data-close>Cancelar</button><button class="button primary">Guardar WOD</button></div></form>`,(f,back)=>{const item={id:w?.id||uid(),title:f.get('title').trim(),type:f.get('type'),modality:f.get('modality'),date:f.get('date'),details:f.get('details').trim(),studentIds:f.get('studentId')?[f.get('studentId')]:[],createdBy:session.id};if(editing)db.wods=db.wods.map(x=>x.id===w.id?{...x,...item}:x);else db.wods.unshift(item);save();back.remove();render();notify('WOD guardado')})}
    function bindStudents(){document.getElementById('newStudent').onclick=()=>openModal('Agregar alumno',`<form><div class="field"><label>Nombre</label><input class="input" name="name" required></div><div class="field"><label>Usuario</label><input class="input" name="username" required autocomplete="off"></div><div class="field"><label>Contraseña inicial</label><input class="input" name="password" required minlength="6" type="password" autocomplete="new-password"></div><div class="field"><label>Nivel</label><select class="select" name="level"><option>Principiante</option><option selected>Intermedio</option><option>Avanzado</option><option>Competidor</option></select></div><div class="form-actions"><button type="button" class="button" data-close>Cancelar</button><button class="button primary">Crear cuenta</button></div></form>`,async(f,back)=>{const username=f.get('username').trim().toLowerCase();if(db.users.some(u=>u.username.toLowerCase()===username)){notify('Ese usuario ya existe');return}const student={id:uid(),name:f.get('name').trim(),username,level:f.get('level')};db.students.push(student);db.users.push({id:uid(),name:student.name,username,role:'athlete',studentId:student.id,passwordHash:await hash(f.get('password'))});save();back.remove();render();notify('Alumno agregado')})}
    function bindCommon(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.getElementById('logout').onclick=()=>{session=null;timer.state='idle';clearInterval(timer.interval);render()};document.getElementById('export')?.addEventListener('click',exportData);document.getElementById('import')?.addEventListener('click',()=>document.getElementById('importFile').click());document.getElementById('importFile')?.addEventListener('change',importData)}
    function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`wodbohx-${today()}.json`;a.click();URL.revokeObjectURL(a.href);notify('Copia JSON descargada')}
    function importData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!d.users||!d.students||!d.wods||!d.results)throw Error();db=d;save();render();notify('Datos importados')}catch{notify('Archivo no válido: usa una copia JSON de WODBOHX')}e.target.value=''};reader.readAsText(file)}
    load();render();
  })();
  </script>
</body>
</html>
